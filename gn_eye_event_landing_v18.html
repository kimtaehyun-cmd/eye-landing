/* V3 - 선명한 블루/화이트 대비의 단일 화면 디자인 */

const CONFIG={CRM_ENDPOINT:'',FORM_SOURCE:'gangnam_eye_presbyopia_cataract_2026'};
/* CRM 예시 payload: {name,age,phone,symptom,consent_privacy,consent_marketing,consented_at,source,landing_url,referrer,utm:{...},click_ids:{fbclid,gclid,gbraid,wbraid},event_id}

  실제 Pixel 코드 삽입은 개발자 담당. 아래 dispatchLead()는 성공 응답을 받은 뒤에만 호출됨. */
const $=id=>document.getElementById(id),modal=$('modal'),form=$('leadForm');let symptom='',lastPane='question';
const panes=['questionPane','leadForm','done','privacyPane'];
function showPane(id){modal.classList.toggle('privacy-mode',id==='privacyPane');$('closeModal').classList.toggle('hidden',id==='privacyPane');panes.forEach(n=>$(n).classList.toggle('hidden',n!==id));$('stepText').textContent=id==='questionPane'?'STEP 1 / 2':id==='leadForm'?'STEP 2 / 2':'';$('modalTitle').textContent=id==='questionPane'?'가장 불편한 증상을\n선택해 주세요.':id==='leadForm'?'혜택받으실 분의 정보를\n입력해 주세요.':id==='done'?'신청 완료':'개인정보처리방침';$('modalTitle').style.whiteSpace='pre-line';$('sheet').scrollTop=0}
function openForm(){modal.classList.add('open');document.body.style.overflow='hidden';if(!symptom)showPane('questionPane');else showPane('leadForm')}
