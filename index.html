$('next').onclick=()=>{if(busy||!selected)return;stage++;draw()};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('p1').focus()}});
for(let [id,next] of [['p1','p2'],['p2',null]]){$(id).addEventListener('input',e=>{let el=e.target;el.value=el.value.replace(/\D/g,'').slice(0,4);if(el.value.length===4&&next)$(next).focus()})}
$('form').onsubmit=async e=>{e.preventDefault();if(submitting)return;const name=$('name').value.trim(),p1=$('p1').value,p2=$('p2').value;if(!name){alertUser('성함을 입력하세요.',()=>$('name').focus());return}if(!/^[가-힣a-zA-Z\s]{2,20}$/.test(name)){alertUser('성함을 정확히 입력하세요.',()=>$('name').focus());return}if(p1.length!==4||p2.length!==4){alertUser('연락처를 입력하세요.',()=>$(p1.length!==4?'p1':'p2').focus());return}if(!SUBMISSION_ENDPOINT){alertUser('입력 내용은 확인되었습니다. 실제 상담 신청을 접수하려면 DB 저장 서버 연결이 필요합니다. 현재는 전송되지 않았습니다.');return}submitting=true;$('submit').disabled=true;try{const res=await fetch(SUBMISSION_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone:'010'+p1+p2,wearing:answers.wearing,surgery_timing:answers.timing,age_group:answers.age,privacy_consent:true,consent_at:new Date().toISOString(),source:location.href,service:'스마일라식'})});if(!res.ok)throw Error('submission failed');$('survey').classList.add('hidden');$('surveyHeader').classList.add('hidden');$('finish').classList.remove('hidden');scrollTop()}catch(e){alertUser('신청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.')}finally{submitting=false;$('submit').disabled=false}};
</script></body></html>
