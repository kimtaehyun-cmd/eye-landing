<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131321"><title>스마일라식 이벤트 | 간단 검진</title>
<style>
:root{--night:#13121f;--ink:#171827;--pink:#ffaccd;--pink2:#ffbdd6;--gray:#858a9a}*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}body{background:#070a16;color:#fff}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #7e9eff;outline-offset:2px} .hidden{display:none!important}body.locked{overflow:hidden}
.app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;background:linear-gradient(160deg,#171622,#14121f 60%,#1b182a);margin:0 auto;overflow:hidden;box-shadow:0 0 40px #0004}.header{width:100%;height:auto;display:block}
.content{padding:clamp(13px,3.5vw,23px) clamp(18px,5.3vw,30px) max(30px,env(safe-area-inset-bottom));animation:fadeIn .3s ease}.coupon-stack{position:relative;height:clamp(196px,52vw,270px);max-width:480px;margin:8px auto 17px}.ticket{position:absolute;left:8%;width:84%;height:46%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;box-shadow:0 10px 28px #0005;border-radius:16px;clip-path:polygon(0 0,100% 0,100% 42%,97% 47%,97% 53%,100% 58%,100% 100%,0 100%,0 58%,3% 53%,3% 47%,0 42%)}.ticket.pink{top:3%;transform:rotate(-5deg);background:linear-gradient(110deg,#ffc1d9,#f8a4c3);z-index:2;color:#14131c}.ticket.white{top:42%;transform:rotate(5deg);background:linear-gradient(120deg,#fff,#f1eef4);color:#191921}.ticket .eyebrow{font-size:clamp(13px,3.1vw,17px);font-weight:800}.ticket strong{font-size:clamp(31px,8.3vw,47px);font-weight:950;letter-spacing:-.07em;line-height:1.18}
.primary{display:flex;justify-content:center;align-items:center;gap:12px;width:94%;min-height:clamp(67px,17vw,88px);margin:10px auto 0;border:0;border-radius:999px;background:linear-gradient(100deg,#ffc0d7,#f7aac9,#fbaecf);box-shadow:0 13px 30px #ffa3c038;color:#10182d;font-size:clamp(23px,6.3vw,33px);font-weight:950;letter-spacing:-.055em;animation:pulse 1.9s ease-in-out infinite}.primary .pill{background:#fff;color:#141725;font-size:clamp(15px,4vw,20px);padding:7px 14px;border-radius:999px;white-space:nowrap;letter-spacing:-.03em}.primary:active{transform:scale(.97)!important}.primary[disabled]{opacity:.65;animation:none}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}@keyframes fadeIn{from{opacity:.2;transform:translateY(9px)}to{opacity:1;transform:none}}
.privacy{color:#b0adba;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:3px;font-size:clamp(12px,3.4vw,15px);margin:19px 0 0;text-align:center;line-height:1.6}.privacy button{padding:0;border:0;background:none;font-size:inherit;color:inherit;text-decoration:underline;text-underline-offset:2px}
.survey-shell{margin:7px auto 0;width:100%;max-width:470px}.progress-top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:0 2px 12px}.progress-top .step{color:#ffc1d9;font-size:clamp(15px,4vw,18px);font-weight:900;letter-spacing:.02em}.progress-top button{color:#bfc1ce;background:none;border:0;padding:6px;font-size:14px}.progress-bar{height:5px;background:#4b4c5e;border-radius:99px;overflow:hidden;margin-bottom:24px}.progress-fill{height:100%;width:25%;background:linear-gradient(90deg,#f59cbe,#ffc2d8);border-radius:99px;transition:width .3s}
.survey-card{background:#fff;border-radius:20px;padding:25px 17px 22px;color:var(--ink);box-shadow:0 14px 30px #0004}.mini{font-size:13px;color:#ca7099;font-weight:900;letter-spacing:.04em;text-align:center;margin-bottom:10px}.question{font-size:clamp(23px,6vw,29px);letter-spacing:-.06em;line-height:1.35;font-weight:900;text-align:center;word-break:keep-all;margin:0 0 22px}.answers{display:flex;flex-direction:column;gap:9px}.answer{border:1px solid #dfe2ea;background:#fafbfe;color:#181f35;text-align:left;min-height:54px;border-radius:13px;padding:11px 18px;font-size:clamp(17px,4.4vw,20px);font-weight:750;transition:transform .15s,background .15s,border-color .15s}.answer:active{transform:scale(.99)}.answer.selected{background:#ffe2ef;border-color:#ec8db8;color:#9c3366;box-shadow:inset 0 0 0 1px #f3a7c7;transform:scale(.99)}.survey-foot{display:flex;gap:9px;margin-top:18px}.back{min-height:51px;min-width:90px;flex:0 0 28%;background:#fff;color:#666c7f;border:1px solid #dfe2ea;border-radius:12px;font-size:17px;font-weight:800}.next{flex:1;min-height:51px;background:linear-gradient(90deg,#f9b3cf,#ed8eb8);color:#161727;border:0;border-radius:12px;font-size:18px;font-weight:900}.next:disabled{opacity:.46}.fields{display:flex;flex-direction:column;gap:11px}.field{height:54px;border:1px solid #dfe2ea;border-radius:12px;background:#fff;padding:0 14px;color:#161b35;font-size:16px;width:100%;min-width:0}.field::placeholder{color:#a4a8b6}.phone{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.phone .field{text-align:center;padding:0 3px}.phone .fixed{background:#f1f2f5;color:#343957}.submit{width:90%;min-height:59px;margin:16px auto 0;border:0;border-radius:99px;background:linear-gradient(95deg,#ffc6db,#f29dc2);display:flex;align-items:center;justify-content:center;gap:9px;color:#18203b;font-size:clamp(19px,5.3vw,25px);font-weight:950;animation:pulse 1.9s ease-in-out infinite}.submit .pill{font-size:14px;background:#fff;border-radius:99px;padding:5px 11px}.survey-card .privacy{color:#888c9b;margin-top:15px}
.done{background:#fff;border-radius:20px;color:#191c31;text-align:center;padding:43px 20px 37px}.done .check{font-size:48px;color:#e987b0}.done h2{font-size:29px;margin:14px 0}.done p{font-size:18px;line-height:1.7;margin:0}
.modal-wrap{position:fixed;inset:0;z-index:30;background:#000a;display:none;justify-content:center;align-items:center;padding:12px}.modal-wrap.open{display:flex}.terms-modal{background:#f7f8fa;border-radius:6px;width:min(100%,560px);height:min(76dvh,640px);display:flex;flex-direction:column;box-shadow:0 10px 30px #0008;overflow:hidden;color:#141414}.modal-head{display:flex;align-items:center;justify-content:flex-end;flex:0 0 52px;padding-right:9px}.modal-head button{width:45px;height:43px;background:transparent;border:0;font-size:32px;color:#111;line-height:1}.modal-body{padding:13px 28px 22px;overflow:auto;white-space:pre-wrap;color:#333;font-size:14px;line-height:1.65;flex:1}.modal-body strong{font-size:17px}.alert{width:min(100%,370px);border-radius:18px;background:#fff;box-shadow:0 12px 35px #0006;color:#1c1c24;text-align:center;padding:28px 18px 18px}.alert-text{font-size:23px;font-weight:850;line-height:1.4;word-break:keep-all}.alert button{margin-top:24px;width:100%;height:48px;background:#f5aaca;border:0;border-radius:12px;font-size:18px;font-weight:900;color:#15203b}
@media (max-width:365px){.coupon-stack{height:185px}.ticket strong{font-size:31px}.survey-card{padding:23px 13px 20px}.question{font-size:22px}.primary{font-size:22px}.primary .pill{font-size:14px}}
@media (prefers-reduced-motion:reduce){.primary,.submit{animation:none}}
.survey-card .privacy{margin-top:18px;margin-bottom:4px}
.privacy-assurance{margin:11px auto 0;max-width:96%;font-size:clamp(11px,2.9vw,13px);color:#888c9b;line-height:1.55;text-align:center;word-break:keep-all}
