<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09257b">
<title>노안·백내장 상담 신청 | 강남성모원안과</title>
<style>
:root{--navy:#06257e;--ink:#101b57}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;color:var(--ink)}
body{background:#e9edf5}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #74a9ff;outline-offset:2px}
.app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;margin:0 auto;background:linear-gradient(110deg,#031e72,#06318c 55%,#061e70);padding-bottom:max(24px,env(safe-area-inset-bottom));box-shadow:0 0 35px #00134120;overflow:hidden}
.top-image{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.survey{position:relative;margin:0 2.9% 0;background:linear-gradient(135deg,#fff,#f7f8fc);border-radius:clamp(14px,3.1vw,22px);box-shadow:0 3px 12px #06195625;padding:clamp(16px,3.5vw,24px) clamp(12px,3vw,20px) clamp(20px,4.3vw,28px);min-height:clamp(154px,39vw,225px);display:flex;flex-direction:column;justify-content:center}
.question{display:flex;align-items:center;gap:clamp(11px,3.2vw,18px);min-height:clamp(56px,12vw,80px);padding:0 clamp(6px,4vw,22px)}.qnum{font-weight:950;font-size:clamp(48px,12.8vw,72px);letter-spacing:-.075em;line-height:1;flex:none;color:#111d59}.vline{height:clamp(50px,11vw,72px);width:1px;background:#a7afc4;flex:none}.qtext{color:#181818;font-size:clamp(20px,5.25vw,29px);line-height:1.3;font-weight:900;letter-spacing:-.07em;word-break:keep-all}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,2.2vw,13px);margin-top:clamp(16px,3.8vw,22px)}.option{height:clamp(53px,12.4vw,72px);border-radius:clamp(12px,2.6vw,17px);border:1px solid #dce0e8;background:#fff;color:#091332;box-shadow:0 3px 5px #09174b20;font-size:clamp(21px,5.1vw,29px);font-weight:900}.option:active{background:#eef3ff;transform:scale(.99)}.option.small{font-size:clamp(17px,4.2vw,23px)}
.back{position:absolute;top:3px;right:12px;border:0;background:none;color:#566080;font-size:12px;padding:8px}.fields{display:flex;flex-direction:column;gap:8px;margin-top:13px}.name-input,.phone-input{border:1px solid #d6dbe5;border-radius:11px;height:47px;background:#fff;font-size:16px;color:#142255;outline-offset:0}.name-input{padding:0 13px;width:100%}.name-input::placeholder,.phone-input::placeholder{color:#9ca4b4}.phone{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.phone-input{width:100%;min-width:0;text-align:center;padding:0 2px}.phone-input:disabled{background:#e9e9e9;color:#17254f;opacity:1}
.submit{width:100%;min-height:50px;margin-top:20px;margin-bottom:5px;transform-origin:center;animation:cta-breathe 2.25s ease-in-out infinite;border:0;border-radius:9px;background:linear-gradient(95deg,#2582fc,#0a51e0);display:flex;justify-content:center;align-items:center;gap:10px;color:white;font-size:clamp(18px,4.9vw,24px);font-weight:900}.agree-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;background:white;color:#1233a7;padding:3px 10px;font-size:clamp(13px,3.4vw,17px)}.privacy-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px;margin-top:10px;font-size:clamp(11px,2.8vw,14px);color:#505b71}.privacy-row label{display:flex;align-items:center;gap:4px}.terms-toggle{border:0;background:none;padding:2px;color:inherit;text-decoration:underline;font-size:inherit;font-weight:400}@keyframes cta-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.error{font-size:12px;color:#bc2035;text-align:center;min-height:0;margin:5px 0 0}
.overlay{position:fixed;inset:0;z-index:20;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.modal{width:min(100%,440px);background:white;border-radius:20px;padding:23px;text-align:center;box-shadow:0 15px 50px #0004}.modal h2{font-size:20px;margin:0 0 12px}.modal p{font-size:16px;line-height:1.55;word-break:keep-all}.modal button,.terms-close{border:0;background:#174ed9;color:white;border-radius:10px;padding:12px 30px;font-weight:800;font-size:16px}
.terms-sheet{position:fixed;z-index:19;inset:0;display:none;background:#000a;align-items:flex-end;justify-content:center}.terms-sheet.open{display:flex}.terms-box{width:min(100%,520px);height:min(77dvh,760px);border-radius:22px 22px 0 0;background:white;display:flex;flex-direction:column;padding:16px 18px max(16px,env(safe-area-inset-bottom));box-shadow:0 -5px 25px #0004}.terms-header{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding-bottom:10px}.terms-header h2{font-size:19px;margin:0}.terms-close{padding:8px 15px;font-size:14px}.terms-body{overflow:auto;overscroll-behavior:contain;padding:14px 2px 25px;white-space:pre-wrap;line-height:1.7;font-size:13px;color:#272e3d;word-break:keep-all}
.success{text-align:center}.success .check{font-size:54px;color:#2075f2}.success h2{font-size:25px;color:#091e60;margin:5px 0}.success p{color:#313b59;font-size:15px;line-height:1.6}
@media(max-width:359px){.question{gap:8px;padding:0 3px}.qnum{font-size:43px}.vline{height:46px}.qtext{font-size:19px}.survey{padding:13px 9px 19px}.options{margin-top:10px}.option{height:50px}}
@media(max-height:650px){.survey{padding-top:12px;padding-bottom:16px}.options{margin-top:10px}.option{height:50px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* 3단계 설문 진행률: 질문 영역 상단의 작은 안내 줄 */
.progress{display:flex;align-items:center;gap:9px;margin:0 3px 13px;min-height:24px;white-space:nowrap;color:#1a244d;font-size:clamp(10px,2.65vw,13px);font-weight:800}
.progress-step{flex:none;border-radius:100px;background:#ffe425;color:#0e1b56;padding:4px 10px;line-height:1.25;font-weight:900}
.progress-track{height:8px;background:#d8deeb;border-radius:50px;flex:1;overflow:hidden;min-width:32px}
.progress-fill{display:block;width:var(--progress);height:100%;border-radius:50px;background:linear-gradient(90deg,#ffe10a,#ffcb00);transition:width .3s ease}
.progress-total{flex:none;color:#303a5c;font-size:clamp(10px,2.5vw,12px)}
/* 이전 버튼은 진행 단계 아래 질문 우측에 표시 */
.back{top:43px}
/* 원형에 가까운 CTA, 가운데 배치 + 기존 간격 유지 */
.submit{width:82%;margin:24px auto 10px;border-radius:999px;min-height:54px;animation:cta-pill-bounce 2s ease-in-out infinite;box-shadow:0 5px 14px #0755dd21}
@keyframes cta-pill-bounce{0%,100%{transform:scale(1)}45%{transform:scale(1.065)}65%{transform:scale(1.025)}}
@media(max-width:359px){.progress{gap:6px;margin-bottom:10px}.progress-step{padding:4px 8px}.submit{width:87%;font-size:17px}}

/* 시니어 가독성: 진행 단계 텍스트 확대, 게이지 폭은 유연하게 축소 */
.progress{gap:10px;font-size:16px;min-height:34px;margin-bottom:15px}
.progress-step{font-size:16px;padding:7px 13px;line-height:1.15;white-space:nowrap}
.progress-total{font-size:15px;font-weight:900;white-space:nowrap;letter-spacing:-.5px}
.progress-track{min-width:20px;height:9px;flex:1 1 auto}
@media(max-width:359px){.progress{gap:7px}.progress-step{font-size:15px;padding:7px 10px}.progress-total{font-size:14px}}

/* 선택 여부를 분명하게 보여주는 시니어 친화형 선택 피드백 */
.option{transition:background-color .17s ease,border-color .17s ease,box-shadow .17s ease,transform .17s ease}
.option.is-selected{background:#ffe849!important;border:3px solid #e8bc00!important;color:#101b57!important;box-shadow:0 0 0 3px #ffdb4f45,0 4px 12px #14245226!important;transform:scale(.975)}
.option.is-selected::after{content:"  ✓";font-weight:900;color:#101b57}
.option.is-pending:not(.is-selected){opacity:.62}
/* 브라우저 기본 알림창 대신 앱 내부 모달 글자 확대 */
.modal{max-width:420px;padding:26px 22px 25px}
.modal h2{font-size:clamp(22px,5.6vw,26px);font-weight:900}
.modal p{font-size:clamp(21px,5.1vw,25px);font-weight:800;line-height:1.5;letter-spacing:-.04em;margin:14px 0 23px}
.modal button{font-size:clamp(19px,5vw,23px);min-width:132px;min-height:52px;border-radius:13px}
</style>
</head>

const survey=document.getElementById('survey');const dialog=document.getElementById('dialog');const termsSheet=document.getElementById('termsSheet');
function question(num,txt){return `<div class="question"><span class="qnum">0${num}</span><span class="vline"></span><span class="qtext">${txt}</span></div>`}
function progressBar(step){return `<div class="progress" aria-label="전체 3문항 중 ${step}단계 진행 중"><span class="progress-step">${step}단계</span><span class="progress-track" role="progressbar" aria-label="설문 진행률" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${step}"><span class="progress-fill" style="--progress:${step*100/3}%"></span></span><span class="progress-total">총 3문항</span></div>`}
let choiceLocked=false;
let resetFirstQuestionOnClose=false;
function chooseWithFeedback(btn,next){
 if(choiceLocked)return;
 choiceLocked=true;
 const all=survey.querySelectorAll('.option');
 all.forEach(b=>{b.classList.add('is-pending');b.disabled=true});
 btn.classList.add('is-selected');
 // 터치 피드백을 충분히 볼 수 있게 약 0.6초간 유지
 setTimeout(()=>{choiceLocked=false;next()},600);
}
function render(){
 if(state.step===1){survey.innerHTML=progressBar(1)+question(1,'노안백내장 수술을 이미 받으셨나요?')+`<div class="options"><button class="option" id="yes" type="button">예</button><button class="option" id="no" type="button">아니요</button></div>`;document.getElementById('yes').onclick=e=>chooseWithFeedback(e.currentTarget,()=>{resetFirstQuestionOnClose=true;showDialog('이미 수술을 받으신 분은 신청하실 수 없습니다.')});document.getElementById('no').onclick=e=>chooseWithFeedback(e.currentTarget,()=>{state.step=2;render()});}
 else if(state.step===2){survey.innerHTML=progressBar(2)+`<button type="button" class="back" id="back">‹ 이전</button>`+question(2,'신청자의 연령대를 선택해 주세요.')+`<div class="options"><button class="option small" data-age="40대">40대</button><button class="option small" data-age="50대">50대</button><button class="option small" data-age="60대">60대</button><button class="option small" data-age="70대 이상">70대 이상</button></div>`;document.getElementById('back').onclick=()=>{state.step=1;render()};survey.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>chooseWithFeedback(b,()=>{state.age=b.dataset.age;state.step=3;render();focusStepThree()}));}
 else if(state.step===3){survey.innerHTML=progressBar(3)+`<button type="button" class="back" id="back">‹ 이전</button>`+question(3,'신청자의 성함 및 연락처를 입력해 주세요.')+`<form id="leadForm" novalidate><div class="fields"><input id="name" class="name-input" type="text" placeholder="성함을 입력해 주세요" autocomplete="name" enterkeyhint="next" maxlength="20" required aria-label="성함"><div class="phone"><input class="phone-input" value="010" aria-label="전화번호 앞자리 010" disabled><input id="p1" class="phone-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" aria-label="전화번호 가운데 네 자리" autocomplete="off" required><input id="p2" class="phone-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" aria-label="전화번호 끝 네 자리" autocomplete="off" required></div></div><button class="submit" id="submitBtn" type="submit">신청 완료하기 <span class="agree-pill">동의</span></button><div class="privacy-row"><span>개인정보 수집 및 이용에 동의합니다.</span><button class="terms-toggle" id="termsToggle" type="button">(약관보기)</button></div><p class="error" id="error" role="alert"></p></form>`;
 document.getElementById('back').onclick=()=>{state.step=2;render()};let name=document.getElementById('name'),p1=document.getElementById('p1'),p2=document.getElementById('p2');name.value=state.name;p1.value=state.p1;p2.value=state.p2;
 // 이름을 입력하는 동안 연락처 칸으로 자동 이동하지 않습니다.
 // 입력 완료 후 사용자가 직접 연락처 칸을 누르거나 키보드의 '다음'을 누를 수 있습니다.
 name.addEventListener('input',()=>{state.name=name.value});
 name.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();p1.focus({preventScroll:true})}});
 p1.addEventListener('input',()=>{p1.value=p1.value.replace(/\D/g,'').slice(0,4);state.p1=p1.value;if(p1.value.length===4)p2.focus({preventScroll:true})});p2.addEventListener('input',()=>{p2.value=p2.value.replace(/\D/g,'').slice(0,4);state.p2=p2.value});p2.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!p2.value)p1.focus({preventScroll:true})});
 document.getElementById('termsToggle').onclick=openTerms;document.getElementById('leadForm').onsubmit=submitLead;
 }else{survey.innerHTML=`<div class="success"><div class="check">✓</div><h2>신청이 완료되었습니다</h2><p>안내를 위해 남겨주신 연락처로 병원에서 연락드릴 예정입니다.<br>전화를 잘 받아주세요!</p></div>`}
}
// 자동 키보드가 열릴 때 상단 이미지가 화면을 차지하지 않도록 질문 카드로 미리 이동합니다.
function alignSurveyToViewport(){
 if(state.step!==3)return;
 const top=survey.getBoundingClientRect().top+window.scrollY;
 // 폼 상단이 키보드 위에 오도록 질문 카드 위에서부터 화면에 표시합니다.
 window.scrollTo({top:Math.max(0,top-8),behavior:'instant'});
}
function focusStepThree(){
 alignSurveyToViewport();
 const field=document.getElementById('name');
 if(!field)return;
 // 클릭 핸들러에서 바로 focus해야 iOS Safari가 자동 키보드 열기를 허용합니다.
 field.focus({preventScroll:true});
 requestAnimationFrame(()=>requestAnimationFrame(alignSurveyToViewport));
 setTimeout(alignSurveyToViewport,250);
 setTimeout(alignSurveyToViewport,550);
}
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',()=>{
   if(state.step===3 && document.activeElement?.matches?.('#name,#p1,#p2')){
     requestAnimationFrame(alignSurveyToViewport);
   }
 });
}
let dialogFocusTarget=null;
function showDialog(msg, focusTargetId=null){dialogFocusTarget=focusTargetId;if(focusTargetId)document.activeElement?.blur();document.getElementById('dialogMessage').textContent=msg;dialog.classList.add('open');document.getElementById('dialogOk').focus()}
function closeDialog(){dialog.classList.remove('open');if(resetFirstQuestionOnClose){resetFirstQuestionOnClose=false;choiceLocked=false;render();return}const target=dialogFocusTarget;dialogFocusTarget=null;if(target){const field=document.getElementById(target);if(field){alignSurveyToViewport();field.focus({preventScroll:true});requestAnimationFrame(alignSurveyToViewport)}}};document.getElementById('dialogOk').onclick=closeDialog;dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});
function openTerms(){termsSheet.classList.add('open');document.getElementById('termsClose').focus()}
function closeTerms(){termsSheet.classList.remove('open');document.getElementById('termsToggle')?.focus()}
document.getElementById('termsClose').onclick=closeTerms;termsSheet.addEventListener('click',e=>{if(e.target===termsSheet)closeTerms()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();if(termsSheet.classList.contains('open'))closeTerms()}});
async function submitLead(e){
 e.preventDefault();if(state.submitting)return;
 const n=document.getElementById('name').value.trim();
 const m=document.getElementById('p1').value;
 const l=document.getElementById('p2').value;
 if(!n){showDialog('성함을 입력하세요.','name');return}
 if(n.length<2){showDialog('성함을 정확히 입력하세요.','name');return}
 if(!/^\d{4}$/.test(m)){showDialog('연락처를 입력하세요.','p1');return}
 if(!/^\d{4}$/.test(l)){showDialog('연락처를 입력하세요.','p2');return}
 /* 신청 버튼을 누르면 개인정보 수집 및 이용 안내에 대한 동의 의사로 처리합니다.
    실제 배포 전 별도 동의의 적법성과 표시 문구를 확인하세요. */
 state.consented=true;
 if(!SUBMISSION_ENDPOINT){showDialog('입력 내용은 확인되었습니다. 실제 상담 DB 저장을 위해 개발자가 SUBMISSION_ENDPOINT를 연결해야 합니다. 현재는 전송되지 않았습니다.');return}
 state.submitting=true;const btn=document.getElementById('submitBtn');btn.disabled=true;btn.firstChild.textContent='전송 중... ';
 try{
  const response=await fetch(SUBMISSION_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,age_group:state.age,phone:'010'+m+l,surgery_history:false,privacy_consent:true,consent_at:new Date().toISOString(),source:location.href})});
  if(!response.ok)throw Error('HTTP '+response.status);
  document.activeElement?.blur();state.step=4;render();
 }catch(err2){showDialog('전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');btn.disabled=false;btn.firstChild.textContent='신청 완료하기 '}
 finally{state.submitting=false}
}

■ 수집하는 개인정보 항목

■ 개인정보의 수집 및 이용목적
“병원”은 수집한 개인정보를 아래에서 정한 목적의 범위 내에서 이용하며, 수집 당시의 목적과 다른 용도로 개인정보를 이용하고자 하는 경우에는 필요한 절차에 따라 별도의 동의를 받아 처리합니다.

1. 서비스 제공

서비스 이용에 따른 본인확인 및 개인 식별, 불량회원의 부정 이용 및 비인가 사용 방지, 만 14세 미만 아동의 개인정보 수집 시 법정대리인의 동의 여부 확인 및 추후 법정대리인의 본인확인, 분쟁 발생 시 기록 보존, 불만 및 민원처리, 고지사항 전달, 회원관리를 위한 각종 정보 및 소식 제공, 설문조사 등의 목적으로 개인정보를 이용합니다.

3. 신규 서비스 개발 및 마케팅·광고 활용

■ 개인정보의 처리 및 보유기간
“병원”은 이용자가 회원으로서 서비스를 이용하는 기간 동안 서비스 제공을 위해 필요한 범위에서 개인정보를 보유·이용합니다.
개인정보는 원칙적으로 수집 및 이용 목적이 달성되거나, 이벤트 참여 시 이벤트 페이지를 통해 별도로 동의받은 개인정보 보유기간이 종료된 경우, 또는 이용자가 직접 개인정보의 삭제·수정이나 회원탈퇴를 요청한 경우 재생할 수 없는 방법을 이용하여 파기합니다.
다만, 관계 법령에 따라 일정 기간 정보를 보존할 필요가 있는 경우에는 해당 법령에서 정한 기간 동안 개인정보를 보관할 수 있습니다.

정보주체는 “병원”이 보유하고 있는 개인정보파일에 대하여 개인정보보호법 제35조(개인정보의 열람)에 따라 개인정보의 열람을 요구할 수 있습니다.
